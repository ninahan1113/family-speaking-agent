name: Deploy Verve to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p _site
          cp mvp/index.html mvp/app.js mvp/styles.css mvp/composer.css mvp/manifest.json mvp/service-worker.js mvp/supabase-bridge.js mvp/icon.svg mvp/icon-180.png _site/
          printf '%s\n' 'window.VERVE_SUPABASE_CONFIG = {' > _site/supabase-config.js
          printf '  url: "%s",\n' "$SUPABASE_URL" >> _site/supabase-config.js
          printf '  anonKey: "%s",\n' "$SUPABASE_ANON_KEY" >> _site/supabase-config.js
          printf '%s\n' '};' >> _site/supabase-config.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
